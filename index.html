<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кто ты в отношениях</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: black;
            color: white;
            border-radius: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #333;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .result {
            font-size: 32px;
            font-weight: bold;
        }

        .small {
            margin-top: 20px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container" id="start">
    <h1>Кто ты в отношениях 💀</h1>
    <p>Пройди супер научный тест (нет)</p>
    <button onclick="startTest()">Начать тест</button>
</div>

<div class="container hidden" id="result">
    <h1 class="result">Надя, ты рабыня во владениях Жеки 💀</h1>
    <p class="small">Поздравляем, тест прошёл успешно (или нет)</p>
    <button onclick="restart()">Пройти ещё раз</button>
</div>

<script>
    function startTest() {
        document.getElementById("start").classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
    }

    function restart() {
        document.getElementById("result").classList.add("hidden");
        document.getElementById("start").classList.remove("hidden");
    }
</script>

</body>
</html>
